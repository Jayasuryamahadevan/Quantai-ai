name: Validate QuantAI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - name: Install lightweight test dependencies
        run: python -m pip install pytest SQLAlchemy pydantic pydantic-settings sqlglot temporalio
      - name: Compile source and tests
        run: python -m compileall -q app scripts tests
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Temporal workflow integration smoke test
        env:
          RUN_TEMPORAL_TEST_SERVER: '1'
        run: python -m pytest -q tests/test_temporal_integration.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
